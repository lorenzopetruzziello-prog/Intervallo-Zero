<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intervallo Zero</title>
<meta name="description" content="Timer a intervalli per HIIT, Tabata e circuiti. Tempo misurato senza deriva.">
<meta name="theme-color" content="#EDEFF2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Intervallo Zero">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- =================== SETUP SCREEN =================== -->
<main class="setup" id="setup">
  <header class="head">
    <h1>Intervallo Zero</h1>
  </header>

  <section class="total" aria-label="Riepilogo">
    <button type="button" class="pick" id="openLib" aria-haspopup="dialog" aria-label="Cambia allenamento">
      <span class="pick-name" id="sumName">Tabata</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg>
    </button>
    <b id="sumTotal">04:00</b>
    <p id="sumInfo">8 round · 20s lavoro / 10s riposo</p>
  </section>

  <section class="group">
    <span class="label">Tempi (secondi)</span>
    <div class="rows" id="rowsTime"></div>
  </section>
  <section class="group">
    <span class="label">Ripetizioni</span>
    <div class="rows" id="rowsReps"></div>
  </section>
  <section class="group">
    <span class="label">Opzioni</span>
    <div class="rows">
      <div class="row switch-row"><span class="opt-label" id="lblSound">Suoni</span><span class="switch"><input type="checkbox" id="optSound" role="switch" aria-labelledby="lblSound" checked><span class="sw-track"></span></span></div>
      <div class="row switch-row"><span class="opt-label" id="lblAwake">Schermo sempre acceso</span><span class="switch"><input type="checkbox" id="optAwake" role="switch" aria-labelledby="lblAwake" checked><span class="sw-track"></span></span></div>
    </div>
  </section>

</main>
<div class="start-bar" id="startBar">
  <div class="bar-in">
    <button class="save-btn" id="saveBtn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>Salva
    </button>
    <button class="start" id="startBtn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15L19.5 12z"/></svg>Avvia
    </button>
  </div>
</div>

<!-- =================== RUN SCREEN =================== -->
<section class="run" id="run" data-phase="prep" hidden aria-label="Allenamento in corso">
  <div class="run-in">
    <div class="run-top">
      <button class="round-btn" id="closeBtn" type="button" aria-label="Termina allenamento">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
      </button>
      <div class="remain"><span class="label">Rimanente</span><b id="totRemain">04:10</b></div>
    </div>

    <h2 class="phase" id="phaseName">Preparati</h2>

    <div class="clock">
      <div class="digits" id="digits" role="timer" aria-live="off">00:10</div>
      <div class="next" id="nextUp">Poi lavoro 20s</div>
    </div>

    <div class="track" id="track" aria-hidden="true"></div>

    <div class="stats">
      <div class="stat"><span class="label">Round</span><b id="statRound">0<small>/8</small></b></div>
      <div class="stat"><span class="label">Ciclo</span><b id="statCycle">1<small>/1</small></b></div>
    </div>

    <div class="controls">
      <button class="ctl" id="prevBtn" type="button" aria-label="Fase precedente">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.2v14H6zM19.5 5v14L9.2 12z"/></svg>
      </button>
      <button class="ctl main" id="playBtn" type="button" aria-label="Pausa">
        <svg viewBox="0 0 24 24" aria-hidden="true" id="playIcon"></svg>
      </button>
      <button class="ctl" id="nextBtn" type="button" aria-label="Fase successiva">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.8 5H18v14h-2.2zM4.5 5v14l10.3-7z"/></svg>
      </button>
    </div>
  </div>
</section>

<!-- Black strip behind the phone's clock/battery on the setup screen (they are white). -->
<div class="status-shim" aria-hidden="true"></div>

<!-- =================== LIBRARY (bottom sheet) =================== -->
<div class="layer sheet-layer" id="lib" hidden>
  <div class="backdrop" data-close></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="libTitle">
    <div class="grabber" aria-hidden="true"></div>
    <header class="sheet-head">
      <h2 id="libTitle">Allenamenti</h2>
      <button type="button" class="close-btn" data-close aria-label="Chiudi">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
      </button>
    </header>
    <div class="sheet-body">
      <span class="label">Salvati</span>
      <ul class="list" id="savedList"></ul>
      <span class="label">Predefiniti</span>
      <ul class="list" id="presetList"></ul>
    </div>
  </section>
</div>

<!-- =================== DIALOG (name / confirm) =================== -->
<div class="layer dlg-layer" id="dlg" hidden>
  <div class="backdrop"></div>
  <form class="dlg" id="dlgForm" role="alertdialog" aria-modal="true" aria-labelledby="dlgTitle" aria-describedby="dlgText" novalidate>
    <h3 id="dlgTitle">Conferma</h3>
    <p id="dlgText"></p>
    <input id="dlgInput" type="text" maxlength="40" autocomplete="off" enterkeyhint="done" aria-labelledby="dlgTitle" hidden>
    <p class="dlg-err" id="dlgErr" role="alert"></p>
    <div class="dlg-actions">
      <button type="button" class="btn btn-plain" id="dlgCancel">Annulla</button>
      <button type="submit" class="btn btn-dark" id="dlgOk">OK</button>
    </div>
  </form>
</div>

<!-- =================== DONE (confirmation screen) =================== -->
<div class="layer done-layer" id="done" hidden>
  <div class="done-card" role="status" aria-live="polite">
    <svg class="done-ico" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M15 27l7.5 7.5L38 19"/></svg>
    <span class="done-title" id="doneTitle">Salvato</span>
    <span class="done-sub" id="doneSub"></span>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
